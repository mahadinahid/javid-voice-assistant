<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Javid</title>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #09090f;
    color: #e2e8f0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* ── Header ── */
header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    background: #0c0c16;
    border-bottom: 1px solid #1a1a28;
    flex-shrink: 0;
}
.status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 8px rgba(34,197,94,0.7);
}
header h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #cbd5e1;
}

/* ── Layout ── */
.layout {
    display: flex;
    flex: 1;
    overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
    width: 250px;
    flex-shrink: 0;
    background: #0c0c16;
    border-right: 1px solid #1a1a28;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #1e1e30 transparent;
}
.panel {
    background: #11111c;
    border: 1px solid #1e1e2e;
    border-radius: 10px;
    padding: 14px;
}
.panel-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #475569;
    margin-bottom: 10px;
}
.empty { font-size: 12px; color: #2d3748; font-style: italic; }

.task-item {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    padding: 5px 0;
    border-bottom: 1px solid #181828;
    font-size: 12.5px;
    color: #94a3b8;
    line-height: 1.45;
}
.task-item:last-child { border-bottom: none; }
.task-item.done .item-text { color: #374151; text-decoration: line-through; }

.check-btn {
    flex-shrink: 0;
    width: 15px; height: 15px;
    margin-top: 2px;
    border-radius: 50%;
    border: 1.5px solid #334155;
    background: transparent;
    color: transparent;
    font-size: 9px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.15s;
}
.check-btn:hover { border-color: #34d399; }
.task-item.done .check-btn { background: #065f46; border-color: #065f46; color: #a7f3d0; }

.item-text { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: text; }
.item-edit {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: #e2e8f0;
    background: #0c0c16;
    border: 1px solid #334155;
    border-radius: 4px;
    padding: 1px 5px;
    outline: none;
}

.del-btn {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: #475569;
    font-size: 12px;
    line-height: 1.45;
    cursor: pointer;
    padding: 0 2px;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
}
.task-item:hover .del-btn, .memory-item:hover .del-btn, .del-btn:focus-visible { opacity: 1; }
.del-btn:hover { color: #f87171; }
.del-btn.confirm { opacity: 1; color: #f87171; font-size: 10.5px; font-weight: 600; }
@media (hover: none) { .del-btn { opacity: 1; } }

.add-task {
    width: 100%;
    margin-bottom: 8px;
    padding: 6px 10px;
    font-size: 12px;
    color: #e2e8f0;
    background: #0c0c16;
    border: 1px solid #1e1e2e;
    border-radius: 6px;
    outline: none;
}
.add-task:focus { border-color: #334155; }
.add-task::placeholder { color: #2d3748; }

.memory-item {
    display: flex;
    gap: 7px;
    padding: 5px 0;
    border-bottom: 1px solid #181828;
    font-size: 12.5px;
    color: #94a3b8;
    line-height: 1.45;
}
.memory-item:last-child { border-bottom: none; }
.mem-dot { color: #7c3aed; flex-shrink: 0; }

/* ── Main ── */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 24px 16px;
    gap: 18px;
    overflow: hidden;
    min-width: 0;
}

/* ── Orb ── */
.orb-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}

.orb-wrapper {
    position: relative;
    width: 156px;
    height: 156px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.orb-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    opacity: 0;
    border: 1.5px solid transparent;
    pointer-events: none;
}

.orb {
    width: 136px;
    height: 136px;
    border-radius: 50%;
    position: relative;
    z-index: 1;
    transition: box-shadow 0.5s ease;
}

/* — Idle: soft blue breathe — */
.orb.idle {
    background: radial-gradient(circle at 38% 30%, #93c5fd, #1d4ed8, #060d1f);
    box-shadow: 0 0 28px rgba(29,78,216,0.4), 0 0 64px rgba(29,78,216,0.12);
    animation: breathe 3.5s ease-in-out infinite;
}
@keyframes breathe {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
}

/* — Listening: red pulse + expanding rings — */
.orb.listening {
    background: radial-gradient(circle at 38% 30%, #fca5a5, #b91c1c, #1c0404);
    box-shadow: 0 0 40px rgba(185,28,28,0.6), 0 0 80px rgba(185,28,28,0.2);
    animation: listen-pulse 0.75s ease-in-out infinite;
}
@keyframes listen-pulse {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.07); }
}
.orb.listening ~ .orb-ring:nth-child(2) {
    border-color: rgba(185,28,28,0.5);
    animation: ring-out 1.5s ease-out infinite;
}
.orb.listening ~ .orb-ring:nth-child(3) {
    border-color: rgba(185,28,28,0.3);
    animation: ring-out 1.5s ease-out 0.75s infinite;
}
@keyframes ring-out {
    0%   { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.9); opacity: 0; }
}

/* — Thinking: purple brightness pulse — */
.orb.thinking {
    background: radial-gradient(circle at 38% 30%, #d8b4fe, #7c3aed, #160929);
    box-shadow: 0 0 40px rgba(124,58,237,0.6), 0 0 80px rgba(124,58,237,0.2);
    animation: think-pulse 1s ease-in-out infinite;
}
@keyframes think-pulse {
    0%,100% { transform: scale(1);    filter: brightness(1); }
    50%      { transform: scale(1.03); filter: brightness(1.3); }
}

/* — Speaking: green wave — */
.orb.speaking {
    background: radial-gradient(circle at 38% 30%, #6ee7b7, #047857, #021a11);
    box-shadow: 0 0 40px rgba(4,120,87,0.6), 0 0 80px rgba(4,120,87,0.2);
    animation: speak-wave 0.35s ease-in-out infinite alternate;
}
@keyframes speak-wave {
    0%   { transform: scale(1); }
    100% { transform: scale(1.08); }
}

/* Orb label */
.orb-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: color 0.3s;
}
.orb-label.idle      { color: #334155; }
.orb-label.listening { color: #f87171; }
.orb-label.thinking  { color: #a78bfa; }
.orb-label.speaking  { color: #34d399; }

/* ── Talk button ── */
.talk-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 26px;
    border-radius: 30px;
    border: 1.5px solid #1e2d3d;
    background: transparent;
    color: #64748b;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    touch-action: none;
    transition: all 0.2s;
    flex-shrink: 0;
}
.talk-btn:hover { border-color: #3b82f6; color: #60a5fa; background: rgba(59,130,246,0.06); }
.talk-btn.active { border-color: #ef4444; color: #f87171; background: rgba(239,68,68,0.08); }

.controls { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.stop-btn {
    display: none;
    padding: 11px 20px;
    border-radius: 30px;
    border: 1.5px solid #7f1d1d;
    background: transparent;
    color: #f87171;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
}
.stop-btn.show { display: inline-flex; }
.stop-btn:hover { background: rgba(239,68,68,0.08); }

.tool-note {
    font-size: 11px;
    color: #64748b;
    font-style: italic;
}

/* ── Chat ── */
.chat-section {
    flex: 1;
    width: 100%;
    max-width: 660px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    gap: 8px;
}

.chat {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 4px;
    scrollbar-width: thin;
    scrollbar-color: #1e1e30 transparent;
}
.chat::-webkit-scrollbar { width: 3px; }
.chat::-webkit-scrollbar-thumb { background: #1e1e30; border-radius: 2px; }

.message { display: flex; flex-direction: column; gap: 3px; max-width: 82%; }
.message.user  { align-self: flex-end;  align-items: flex-end; }
.message.javid { align-self: flex-start; align-items: flex-start; }

.msg-who {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}
.message.user  .msg-who { color: #3b82f6; }
.message.javid .msg-who { color: #7c3aed; }

.msg-bubble {
    padding: 9px 14px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.55;
}
.message.user  .msg-bubble {
    background: #1e3a5f;
    color: #bfdbfe;
    border-bottom-right-radius: 4px;
}
.message.javid .msg-bubble {
    background: #13131f;
    color: #e2e8f0;
    border: 1px solid #1e1e2e;
    border-bottom-left-radius: 4px;
}

.chat-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 10.5px;
    color: #475569;
    letter-spacing: 0.04em;
    margin: 6px 0;
}
.chat-divider::before, .chat-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #1a1a28;
}
.load-earlier {
    align-self: center;
    padding: 5px 14px;
    border-radius: 14px;
    border: 1px solid #1e1e2e;
    background: transparent;
    color: #64748b;
    font-size: 11.5px;
    cursor: pointer;
}
.load-earlier:hover { color: #94a3b8; border-color: #334155; }

.new-chat-btn {
    margin-left: auto;
    padding: 6px 14px;
    border-radius: 16px;
    border: 1px solid #1e2d3d;
    background: transparent;
    color: #64748b;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
}
.new-chat-btn:hover { color: #60a5fa; border-color: #3b82f6; }

/* Typing indicator */
.typing { display: flex; align-items: center; gap: 5px; padding: 12px 14px; }
.typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #475569;
    animation: dot-bounce 1.2s ease-in-out infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot-bounce {
    0%,60%,100% { transform: translateY(0); }
    30%          { transform: translateY(-6px); }
}

/* ── Input row ── */
.input-row {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 660px;
    padding-top: 8px;
    border-top: 1px solid #1a1a28;
    flex-shrink: 0;
}
.text-input {
    flex: 1;
    padding: 10px 16px;
    border-radius: 22px;
    border: 1px solid #1a1a28;
    background: #11111c;
    color: #e2e8f0;
    font-size: 13.5px;
    outline: none;
    transition: border-color 0.2s;
}
.text-input:focus { border-color: #2d3748; }
.text-input::placeholder { color: #2d3748; }

.send-btn {
    padding: 10px 20px;
    border-radius: 22px;
    border: none;
    background: #1d4ed8;
    color: #fff;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
    flex-shrink: 0;
}
.send-btn:hover:not(:disabled) { background: #2563eb; }
.send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* ── Toast ── */
.toast {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: #3b0000;
    color: #fca5a5;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    border: 1px solid #7f1d1d;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 99;
    white-space: nowrap;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
    <div class="status-dot"></div>
    <h1>JAVID</h1>
    <button id="new-chat-btn" class="new-chat-btn" title="Start a fresh conversation (history is kept)">+ New chat</button>
</header>

<div class="layout">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">
        <div class="panel">
            <div class="panel-title">Tasks</div>
            <input id="add-task" class="add-task" type="text" placeholder="+ Add a task" autocomplete="off">
            <div id="tasks-list"><p class="empty">No tasks yet.</p></div>
        </div>
        <div class="panel">
            <div class="panel-title">Memory</div>
            <div id="memory-list"><p class="empty">Nothing stored yet.</p></div>
        </div>
    </aside>

    <!-- ── Main ── -->
    <main class="main">

        <!-- Orb -->
        <div class="orb-section">
            <div class="orb-wrapper">
                <div id="orb" class="orb idle"></div>
                <div class="orb-ring"></div>
                <div class="orb-ring"></div>
            </div>
            <span id="orb-label" class="orb-label idle">Ready</span>
        </div>

        <!-- Hold-to-talk -->
        <div class="controls">
            <button id="talk-btn" class="talk-btn">
                <span>🎙</span>
                <span id="btn-label">Hold to Talk &nbsp;·&nbsp; Space</span>
            </button>
            <button id="stop-btn" class="stop-btn" title="Stop (Esc)">■ Stop</button>
        </div>

        <!-- Chat -->
        <div class="chat-section">
            <div id="chat" class="chat"></div>

            <!-- Input -->
            <div class="input-row">
                <input id="text-input" class="text-input" type="text"
                       placeholder="Or type a message…" autocomplete="off">
                <button id="send-btn" class="send-btn">Send</button>
            </div>
        </div>

    </main>
</div>

<div id="toast" class="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let mediaRecorder = null;
let audioChunks   = [];
let micStream     = null;
let isRecording   = false;
let isBusy        = false;

// ── Orb ───────────────────────────────────────────────────────────────────
const ORB_STATES = {
    idle:      { label: 'Ready',        cls: 'idle' },
    listening: { label: 'Listening…',   cls: 'listening' },
    thinking:  { label: 'Thinking…',    cls: 'thinking' },
    speaking:  { label: 'Speaking…',    cls: 'speaking' },
};

function setOrb(state) {
    const s = ORB_STATES[state];
    const orb   = document.getElementById('orb');
    const label = document.getElementById('orb-label');
    orb.className   = `orb ${s.cls}`;
    label.className = `orb-label ${s.cls}`;
    label.textContent = s.label;
}

// ── Recording ─────────────────────────────────────────────────────────────
async function startRecording() {
    if (isRecording) return;
    stopAll();  // talking over Javid cuts him off
    try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
        showToast('Microphone blocked — allow access in browser settings.');
        return;
    }
    audioChunks  = [];
    mediaRecorder = new MediaRecorder(micStream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = onStop;
    mediaRecorder.start(100);
    isRecording = true;
    setOrb('listening');
    const btn = document.getElementById('talk-btn');
    btn.classList.add('active');
    document.getElementById('btn-label').textContent = 'Release to Send';
}

function stopRecording() {
    if (!isRecording || !mediaRecorder) return;
    isRecording = false;
    mediaRecorder.stop();
    micStream.getTracks().forEach(t => t.stop());
    const btn = document.getElementById('talk-btn');
    btn.classList.remove('active');
    document.getElementById('btn-label').textContent = 'Hold to Talk · Space';
    setOrb('thinking');
}

async function onStop() {
    if (!audioChunks.length) { setOrb('idle'); return; }
    const mime = mediaRecorder.mimeType || 'audio/webm';
    const blob = new Blob(audioChunks, { type: mime });
    const ext  = mime.split('/')[1]?.split(';')[0] || 'webm';
    await submitAudio(blob, ext);
}

// ── Voice ─────────────────────────────────────────────────────────────────
// Each sentence is synthesized by the server's neural voice (/speak) as soon as
// it arrives, then played in order. If /speak is unavailable, fall back to the
// browser's built-in speech for the rest of the session.
const synth = window.speechSynthesis;
let ttsMode = 'neural';      // 'neural' | 'browser'
let voice = null;            // browser fallback voice
let pendingSpeech = '';      // text received but not yet spoken (no sentence end yet)
let utterancesLeft = 0;      // queued chunks still to finish
let streamDone = true;
let speechQueue = [];
let playing = false;
let currentAudio = null;
let speechGen = 0;           // bumps on stop, so stale callbacks are ignored
let speechCtrl = new AbortController();

// Most natural male voices first; Premium/Enhanced macOS voices win if installed.
const MALE_VOICES = ['Evan', 'Nathan', 'Tom', 'Aaron', 'Daniel', 'Arthur', 'Oliver',
                     'Google UK English Male', 'Reed', 'Eddy', 'Rishi', 'Alex'];
function pickVoice() {
    const voices = (synth?.getVoices() || []).filter(v => v.lang.startsWith('en'));
    const rank = v => {
        const i = MALE_VOICES.findIndex(n => v.name.startsWith(n));
        if (i < 0) return Infinity;
        return i - (/premium|enhanced/i.test(v.name) ? 100 : 0);
    };
    voice = voices.slice().sort((a, b) => rank(a) - rank(b))[0] || null;
    if (voice && rank(voice) === Infinity) voice = voices.find(v => v.localService) || voice;
}
if (synth) {
    pickVoice();
    synth.onvoiceschanged = pickVoice;
}

async function fetchAudio(text) {
    const res = await fetch('/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
        signal: speechCtrl.signal,
    });
    if (!res.ok) throw new Error('tts ' + res.status);
    return URL.createObjectURL(await res.blob());
}

function speakChunk(text) {
    text = text.trim();
    if (!text || !/[a-z0-9]/i.test(text)) return;
    utterancesLeft++;
    const audio = ttsMode === 'neural' ? fetchAudio(text) : null;
    audio?.catch(() => {});  // handled in playNext
    speechQueue.push({ text, audio });
    if (!playing) playNext();
}

async function playNext() {
    const gen = speechGen;
    const item = speechQueue.shift();
    if (!item) { playing = false; maybeIdle(); return; }
    playing = true;

    let url = null;
    if (item.audio) {
        try { url = await item.audio; }
        catch { if (gen === speechGen) ttsMode = 'browser'; }
    }
    if (gen !== speechGen) { if (url) URL.revokeObjectURL(url); return; }

    const done = () => {
        if (gen !== speechGen) return;
        if (url) URL.revokeObjectURL(url);
        currentAudio = null;
        utterancesLeft--;
        playNext();
    };

    if (url) {
        const a = currentAudio = new Audio(url);
        a.onplay = () => setOrb('speaking');
        a.onended = a.onerror = done;
        a.play().catch(done);
    } else {
        browserSpeak(item.text, done);
    }
}

function browserSpeak(text, done) {
    if (!synth) { done(); return; }
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.rate = 1.03;
    u.onstart = () => setOrb('speaking');
    u.onend = u.onerror = done;
    synth.speak(u);
}

function stopSpeech() {
    speechGen++;
    speechCtrl.abort();
    speechCtrl = new AbortController();
    speechQueue = [];
    playing = false;
    currentAudio?.pause();
    currentAudio = null;
    synth?.cancel();
    pendingSpeech = '';
    utterancesLeft = 0;
}

// Speak every complete sentence in the buffer; keep the unfinished tail.
// A boundary is .!? followed by whitespace, so "27.3" or "3.5" never split.
function feedSpeech(text, flush = false) {
    pendingSpeech += text;
    const boundary = /[.!?]+["')\]]*\s+/g;
    let m, last = 0;
    while ((m = boundary.exec(pendingSpeech))) {
        speakChunk(pendingSpeech.slice(last, boundary.lastIndex));
        last = boundary.lastIndex;
    }
    pendingSpeech = pendingSpeech.slice(last);
    if (flush) { speakChunk(pendingSpeech); pendingSpeech = ''; }
}

function maybeIdle() {
    if (streamDone && utterancesLeft <= 0 && !isRecording) {
        utterancesLeft = 0;
        setOrb('idle');
        setStopVisible(false);
    }
}

// ── Streaming API ─────────────────────────────────────────────────────────
let abortCtrl = null;

function setStopVisible(on) {
    document.getElementById('stop-btn').classList.toggle('show', on);
}

function stopAll() {
    abortCtrl?.abort();
    stopSpeech();
    streamDone = true;
    hideTyping();
    if (!isRecording) setOrb('idle');
    setStopVisible(false);
}

// POST and consume the newline-delimited JSON event stream.
async function streamReply(url, init, { onTranscript } = {}) {
    stopAll();
    isBusy = true;
    streamDone = false;
    const ctrl = abortCtrl = new AbortController();
    setOrb('thinking');
    setStopVisible(true);
    showTyping();

    let bubble = null, reply = '';
    const ensureBubble = () => {
        if (!bubble) { hideTyping(); bubble = addMsg('javid', ' '); }
        return bubble;
    };

    try {
        const res = await fetch(url, { ...init, signal: ctrl.signal });
        if (!res.ok) throw new Error(res.status);
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            let nl;
            while ((nl = buf.indexOf('\n')) >= 0) {
                const line = buf.slice(0, nl).trim();
                buf = buf.slice(nl + 1);
                if (!line) continue;
                const ev = JSON.parse(line);

                if (ev.type === 'transcript') {
                    onTranscript?.(ev.text);
                } else if (ev.type === 'tool') {
                    showToolNote(ev.name);
                } else if (ev.type === 'delta') {
                    reply += ev.text;
                    ensureBubble().textContent = reply;
                    scrollChat();
                    feedSpeech(ev.text);
                } else if (ev.type === 'error') {
                    showToast(ev.message);
                } else if (ev.type === 'done') {
                    refreshSidebar(ev.tasks, ev.memory);
                }
            }
        }
        feedSpeech('', true);
    } catch (e) {
        if (e.name !== 'AbortError') showToast('Server error — is it running?');
    } finally {
        if (bubble && !reply.trim()) bubble.closest('.message').remove();
        if (ctrl !== abortCtrl) return;  // a newer request has taken over
        hideTyping();
        streamDone = true;
        isBusy = false;
        abortCtrl = null;
        maybeIdle();
    }
}

async function submitAudio(blob, ext) {
    const fd = new FormData();
    fd.append('audio', blob, `audio.${ext}`);
    await streamReply('/talk', { method: 'POST', body: fd }, {
        onTranscript: text => {
            if (!text) return;
            hideTyping();
            addMsg('user', text);
            showTyping();
        },
    });
}

async function submitText(text) {
    if (!text.trim() || isBusy) return;
    addMsg('user', text);
    await streamReply('/type', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
    });
}

// ── Helpers ───────────────────────────────────────────────────────────────
const TOOL_LABELS = {
    web_search: 'Searching the web…',
    add_task: 'Adding task…', list_tasks: 'Checking tasks…',
    delete_task: 'Deleting task…', complete_task: 'Completing task…',
    remember: 'Saving to memory…', recall: 'Checking memory…', clear_memory: 'Clearing memory…',
    get_datetime: 'Checking the time…', morning_briefing: 'Preparing your briefing…',
};

function showToolNote(name) {
    document.getElementById('tool-note')?.remove();
    const typing = document.getElementById('typing-msg');
    if (!typing) return;
    const el = document.createElement('span');
    el.id = 'tool-note';
    el.className = 'tool-note';
    el.textContent = TOOL_LABELS[name] || `Using ${name}…`;
    typing.appendChild(el);
    scrollChat();
}

function scrollChat() {
    const chat = document.getElementById('chat');
    chat.scrollTop = chat.scrollHeight;
}

function makeMsg(role, text) {
    const el = document.createElement('div');
    el.className = `message ${role}`;
    el.innerHTML = `
        <span class="msg-who">${role === 'user' ? 'You' : 'Javid'}</span>
        <div class="msg-bubble">${esc(text)}</div>`;
    return el;
}

function addMsg(role, text) {
    if (!text) return;
    const chat = document.getElementById('chat');
    const el = makeMsg(role, text);
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el.querySelector('.msg-bubble');
}

function makeDivider(label) {
    const el = document.createElement('div');
    el.className = 'chat-divider';
    el.textContent = label;
    return el;
}

// ── History ───────────────────────────────────────────────────────────────
let oldestIndex = null;   // log index of the oldest message on screen

const fmtDay  = d => d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
const fmtTime = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

// Turn log entries into DOM nodes, with a date line whenever the day changes.
function historyNodes(entries) {
    const nodes = [];
    let lastDay = null;
    for (const e of entries) {
        const d = new Date(e.ts);
        const day = d.toDateString();
        if (e.role === 'divider') {
            nodes.push(makeDivider(`New conversation · ${fmtDay(d)}, ${fmtTime(d)}`));
            lastDay = day;
            continue;
        }
        if (day !== lastDay) { nodes.push(makeDivider(fmtDay(d))); lastDay = day; }
        nodes.push(makeMsg(e.role === 'user' ? 'user' : 'javid', e.text));
    }
    return nodes;
}

async function loadHistory(before = null) {
    const res = await fetch('/history' + (before === null ? '' : `?before=${before}`));
    const { messages, has_more } = await res.json();
    const chat = document.getElementById('chat');
    document.getElementById('load-earlier')?.remove();

    // Prepend while keeping the user's scroll position steady.
    const prevHeight = chat.scrollHeight;
    const frag = document.createDocumentFragment();
    if (has_more) {
        const btn = document.createElement('button');
        btn.id = 'load-earlier';
        btn.className = 'load-earlier';
        btn.textContent = 'Load earlier messages';
        btn.onclick = () => loadHistory(oldestIndex);
        frag.appendChild(btn);
    }
    historyNodes(messages).forEach(n => frag.appendChild(n));
    chat.prepend(frag);
    if (messages.length) oldestIndex = messages[0].i;

    chat.scrollTop = before === null ? chat.scrollHeight : chat.scrollHeight - prevHeight;
}

async function newChat() {
    stopAll();
    try {
        await fetch('/reset', { method: 'POST' });
    } catch {
        showToast('Server error — is it running?');
        return;
    }
    const chat = document.getElementById('chat');
    chat.appendChild(makeDivider(`New conversation · ${fmtTime(new Date())}`));
    chat.scrollTop = chat.scrollHeight;
    document.getElementById('text-input').focus();
}
document.getElementById('new-chat-btn').addEventListener('click', newChat);

function showTyping() {
    hideTyping();
    const chat = document.getElementById('chat');
    const el   = document.createElement('div');
    el.className = 'message javid';
    el.id = 'typing-msg';
    el.innerHTML = `
        <span class="msg-who">Javid</span>
        <div class="msg-bubble typing"><span></span><span></span><span></span></div>`;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
    document.getElementById('typing-msg')?.remove();
}

// ── Sidebar: tasks + memory, editable in place ────────────────────────────
// Click the circle to complete, click text to edit (Enter saves, Esc cancels),
// ✕ then "Delete?" to remove. All direct to the server, no LLM involved.
function refreshSidebar(tasks, memory) {
    if (tasks) renderTasks(tasks);
    if (memory) renderMemory(memory);
}

function renderTasks(tasks) {
    const tl = document.getElementById('tasks-list');
    tl.innerHTML = tasks.length
        ? tasks.map(t => `
            <div class="task-item${t.done ? ' done' : ''}" data-n="${t.number}">
                <button class="check-btn" title="${t.done ? 'Mark not done' : 'Mark done'}">✓</button>
                <span class="item-text" title="Click to edit">${esc(stripTimestamp(t.text))}</span>
                <button class="del-btn" title="Delete">✕</button>
            </div>`).join('')
        : '<p class="empty">No tasks yet.</p>';
}

function renderMemory(memory) {
    const ml = document.getElementById('memory-list');
    ml.innerHTML = memory.length
        ? memory.map((f, i) => `
            <div class="memory-item" data-i="${i}">
                <span class="mem-dot">•</span>
                <span class="item-text" title="Click to edit">${esc(f)}</span>
                <button class="del-btn" title="Delete">✕</button>
            </div>`).join('')
        : '<p class="empty">Nothing stored yet.</p>';
}

async function api(method, url, body) {
    try {
        const res = await fetch(url, {
            method,
            headers: body ? { 'Content-Type': 'application/json' } : {},
            body: body ? JSON.stringify(body) : undefined,
        });
        if (!res.ok) throw new Error(res.status);
        return await res.json();
    } catch {
        showToast('Could not save — refreshing.');
        const [tr, mr] = await Promise.all([fetch('/tasks'), fetch('/memory')]);
        refreshSidebar(await tr.json(), await mr.json());
        return null;
    }
}

const taskUrl = row => `/tasks/${row.dataset.n}`;
const factUrl = row => `/memory/${row.dataset.i}`;

function startEdit(span, save) {
    const original = span.textContent;
    const input = document.createElement('input');
    input.className = 'item-edit';
    input.value = original;
    span.replaceWith(input);
    input.focus();
    input.select();
    let finished = false;
    const finish = commit => {
        if (finished) return;
        finished = true;
        const text = input.value.trim();
        input.replaceWith(span);
        if (commit && text && text !== original) {
            span.textContent = text;
            save(text);
        }
    };
    input.addEventListener('keydown', e => {
        e.stopPropagation();  // keep Space / Esc from reaching talk & stop shortcuts
        if (e.key === 'Enter') finish(true);
        if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
}

function armDelete(btn, remove) {
    if (btn.classList.contains('confirm')) { remove(); return; }
    btn.classList.add('confirm');
    btn.textContent = 'Delete?';
    setTimeout(() => {
        if (!btn.isConnected) return;
        btn.classList.remove('confirm');
        btn.textContent = '✕';
    }, 2500);
}

document.getElementById('tasks-list').addEventListener('click', async e => {
    const row = e.target.closest('.task-item');
    if (!row) return;
    if (e.target.closest('.check-btn')) {
        const done = !row.classList.contains('done');
        row.classList.toggle('done', done);  // optimistic
        const tasks = await api('PATCH', taskUrl(row), { done });
        if (tasks) renderTasks(tasks);
    } else if (e.target.closest('.del-btn')) {
        armDelete(e.target, async () => {
            const tasks = await api('DELETE', taskUrl(row));
            if (tasks) renderTasks(tasks);
        });
    } else if (e.target.classList.contains('item-text')) {
        startEdit(e.target, async text => {
            const tasks = await api('PATCH', taskUrl(row), { text });
            if (tasks) renderTasks(tasks);
        });
    }
});

document.getElementById('memory-list').addEventListener('click', e => {
    const row = e.target.closest('.memory-item');
    if (!row) return;
    if (e.target.closest('.del-btn')) {
        armDelete(e.target, async () => {
            const memory = await api('DELETE', factUrl(row));
            if (memory) renderMemory(memory);
        });
    } else if (e.target.classList.contains('item-text')) {
        startEdit(e.target, async text => {
            const memory = await api('PATCH', factUrl(row), { text });
            if (memory) renderMemory(memory);
        });
    }
});

document.getElementById('add-task').addEventListener('keydown', async e => {
    e.stopPropagation();
    if (e.key === 'Escape') { e.target.value = ''; e.target.blur(); }
    if (e.key !== 'Enter') return;
    const text = e.target.value.trim();
    if (!text) return;
    e.target.value = '';
    const tasks = await api('POST', '/tasks', { text });
    if (tasks) renderTasks(tasks);
});

function stripTimestamp(text) {
    return text.replace(/^\[[\d\- :]+\]\s*/, '');
}

function esc(str) {
    return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
}

// ── Events ────────────────────────────────────────────────────────────────
const talkBtn = document.getElementById('talk-btn');
talkBtn.addEventListener('mousedown',  e => { e.preventDefault(); startRecording(); });
talkBtn.addEventListener('mouseup',    stopRecording);
talkBtn.addEventListener('mouseleave', () => { if (isRecording) stopRecording(); });
talkBtn.addEventListener('touchstart', e => { e.preventDefault(); startRecording(); }, { passive: false });
talkBtn.addEventListener('touchend',   stopRecording);

const typingInField = () => document.activeElement?.matches('input, textarea, [contenteditable]');

document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.repeat && !typingInField()) {
        e.preventDefault();
        startRecording();
    }
});
document.addEventListener('keyup', e => {
    if (e.code === 'Space' && !typingInField()) {
        stopRecording();
    }
});

document.getElementById('stop-btn').addEventListener('click', stopAll);
document.addEventListener('keydown', e => { if (e.key === 'Escape') stopAll(); });

const textInput = document.getElementById('text-input');
const sendBtn   = document.getElementById('send-btn');

function handleSend() {
    const text = textInput.value.trim();
    if (text) { textInput.value = ''; submitText(text); }
}
sendBtn.addEventListener('click', handleSend);
textInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

// Disable Send while busy
setInterval(() => {
    sendBtn.disabled = isBusy;
}, 200);

// ── Init: load sidebar on page open ───────────────────────────────────────
(async () => {
    try {
        const [tr, mr] = await Promise.all([fetch('/tasks'), fetch('/memory')]);
        refreshSidebar(await tr.json(), await mr.json());
        await loadHistory();
        const { text } = await (await fetch('/greeting')).json();
        addMsg('javid', text);
        greet(text);
    } catch { /* server not ready */ }
})();

// Browsers block speech until the user interacts with the page,
// so if the greeting can't play now, play it on the first click/key.
function greet(text) {
    streamDone = true;
    if (navigator.userActivation?.hasBeenActive) { speakChunk(text); return; }
    const once = e => {
        removeEventListener('pointerdown', once, true);
        removeEventListener('keydown', once, true);
        if (e.code === 'Space' || e.target.closest?.('#talk-btn') || isBusy) return;  // user is about to talk
        speakChunk(text);
    };
    addEventListener('pointerdown', once, true);
    addEventListener('keydown', once, true);
}
</script>
